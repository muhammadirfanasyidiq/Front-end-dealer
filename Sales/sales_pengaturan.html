<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/sales.css">
    <link rel="stylesheet" href="/asset/bootstrap/css/bootstrap.min.css">
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <div class="header" id="header"></div>

        <div class="d-flex justify-content-center align-items-center min-vh-100">
            <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
                <h2 class="mb-4 text-center">Ganti Password</h2>
                <form id="changePasswordForm">
                    <div class="mb-3">
                        <label for="oldPassword" class="form-label">Password Saat ini :</label>
                        <input type="password" id="oldPassword" class="form-control"
                            placeholder="Masukan Password Saat ini" required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Password Baru :</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="Masukan Password Baru"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Konfirmasi Password Baru :</label>
                        <input type="password" id="confirmPassword" class="form-control"
                            placeholder="Masukan Ulang Password Baru" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ganti Password</button>
                </form>
            </div>
        </div>

    </div>
    <script>
        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        document.getElementById("changePasswordForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const oldPassword = document.getElementById("oldPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            if (newPassword !== confirmPassword) {
                message.textContent = "Password baru tidak cocok!";
                message.style.color = "red";
                return;
            }

            const token = sessionStorage.getItem("authToken");

            try {
                const res = await fetch("http://localhost:8080/salesgantipw", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        current_password: oldPassword,
                        new_password: newPassword
                    })
                });
                const data = await res.json();
                console.log("Status:", res.status);
                console.log("Response data:", data);
                if (!res.ok) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal',
                        text: data.message || "Gagal mengganti password"
                    });
                    return;
                }
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil',
                    text: 'Password berhasil diganti!'
                });
            } catch (err) {
                message.textContent = "Terjadi kesalahan saat menghubungi server.";
                message.style.color = "red";
                console.error(err);
            }
        });

        function toggleMenu(menuId) {
            const submenu = document.getElementById('submenu-' + menuId);
            const arrow = document.getElementById('arrow-' + menuId);
            submenu.classList.toggle('show');
            arrow.classList.toggle('rotate');
        }

        const currentPath = window.location.pathname.split("/").pop();
        const allLinks = document.querySelectorAll('.menu a');
        allLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                const submenu = link.closest('.submenu');
                if (submenu) {
                    submenu.classList.add('show');
                    const menuId = submenu.id.split('-')[1];
                    const arrow = document.getElementById('arrow-' + menuId);
                    if (arrow) arrow.classList.add('rotate');
                }
            }
        });

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", function (e) {
                e.preventDefault();
                sessionStorage.removeItem("authToken");
                sessionStorage.removeItem("userData");
                window.location.href = "../login.html";
            });
        }
    </script>
    <script src="/asset/bootstrap/js/bootstrap.bundle.min.js" defer></script>
    <script src="Js/sales.js" defer></script>
    <!-- <script src="../asset/js/data.js"defer></script> -->
</body>

</html>
