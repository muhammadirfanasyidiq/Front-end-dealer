<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | MobilBagus</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-image: url('../asset/img/login.jpg');
      /* Ganti dengan path gambar kamu */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #000;
      font-size: 1.5rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.8rem 2.5rem 0.8rem 2.5rem;
      border: 1px solid #000;
      border-radius: 8px;
      background: transparent;
      color: #000;
      font-size: 1rem;
    }

    .input-group i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: #000;
    }

    .input-group .toggle-password {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #000;
    }

    .login-btn {
      width: 100%;
      background: #000;
      color: #fff;
      padding: 0.9rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-btn:hover {
      background: #222;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>LOGIN</h2>

    <form id="loginForm">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" name="username" id="username" placeholder="USERNAME" required>
      </div>

      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="PASSWORD" required>
        <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
      </div>

      <button type="submit" class="login-btn">LOGIN</button>
    </form>
  </div>

  <script>
    function togglePassword() {
      const password = document.getElementById("password");
      const icon = document.querySelector(".toggle-password");
      if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        password.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      fetch("http://localhost:8080/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      })
        .then(response => {
          if (!response.ok) {
            throw new Error("Login gagal");
          }
          return response.json();
        })
        .then(data => {
          // console.log(data);
          // Pastikan respons mengandung token JWT dan data user
          if (!data.token || !data.data) {
            throw new Error("Data tidak lengkap dari server");
          }

          // Simpan token JWT dan data user
          sessionStorage.setItem('authToken', data.token);
          sessionStorage.setItem('userData', JSON.stringify(data.data));

          // Redirect berdasarkan role
          const userRole = data.data.role; // Asumsikan role ada di data.user

          switch (userRole.toLowerCase()) {
            case 'admin':
              window.location.href = "../Admin/dashboard.html";
              break;
            case 'sales':
              window.location.href = "../Sales/dashboard-sales.html";
              break;
            case 'customer service':
              window.location.href = "../Cs/csdashboard.html";
              break;
            default:
              throw new Error("Role tidak dikenali");
          }
        })
        .catch(error => {
          console.error("Error:", error);
          alert("Login gagal: " + error.message);
          // Optional: Clear storage jika login gagal
          sessionStorage.removeItem('authToken');
          sessionStorage.removeItem('userData');
        });
    });
  </script>

</body>

</html>
