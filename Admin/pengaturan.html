<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Pengaturan | Ganti Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: #f8f8f8;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 300px;
      background-color: #1e1c1a;
      color: white;
      padding: 1rem;
      transition: transform 0.3s ease;
    }

    .sidebar.hidden {
      transform: translateX(-100%);
      position: absolute;
      z-index: 1000;
    }

    .sidebar h1 {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
    }

    .menu-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .menu-toggle:hover {
      background-color: #2c2a28;
    }

    .menu-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
      padding: 0.5rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .menu-link:hover {
      background-color: #2c2a28;
    }

    .submenu {
      display: none;
      flex-direction: column;
      margin-left: 1.5rem;
      margin-top: 0.5rem;
    }

    .submenu a {
      padding: 0.3rem 0.5rem;
      border-radius: 5px;
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .submenu a:hover {
      background-color: #3d3a36;
    }

    .submenu.show {
      display: flex;
    }

    .submenu a.active {
      background-color: #675cff;
    }

    .icon {
      width: 20px;
    }

    .arrow {
      font-size: 0.7rem;
      transition: transform 0.3s;
    }

    .arrow.rotate {
      transform: rotate(180deg);
    }

    @media(max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        transform: none;
        position: relative;
      }
    }

    .main {
      flex: 1;
      padding: 2rem;
    }

    .header {
      background-color: #675cff;
      color: white;
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 8px;
      margin-bottom: 2rem;
    }

    .admin {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.8rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 38px;
      cursor: pointer;
    }

    .btn-submit {
      margin-top: 1.5rem;
      padding: 0.8rem 1.5rem;
      background: #675cff;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-submit:hover {
      background: #5744ff;
    }

    #message {
      margin-top: 1rem;
      color: red;
    }
  </style>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <h1>MobilBagus</h1>
    <div class="menu">
      <div class="menu-item"><a href="dashboard.html" class="menu-link"><span class="icon">🏠</span> Dashboard</a></div>
      <div class="menu-item"><a href="manajemen-mobil.html" class="menu-link"><span class="icon">🚗</span> Manajemen
          Mobil</a></div>

      <div class="menu-item">
        <div class="menu-toggle" onclick="toggleMenu('penjualan')">
          <span class="menu-link"><span class="icon">📈</span> Penjualan</span>
          <span class="arrow" id="arrow-penjualan">▼</span>
        </div>
        <div class="submenu" id="submenu-penjualan">
          <a href="data-penjualan.html">Data Penjualan</a>
          <a href="daftar-pembayaran.html">Daftar Penjualan</a>
          <a href="laporan.html">Laporan</a>
        </div>
      </div>

      <div class="menu-item"><a href="pelanggan.html" class="menu-link"><span class="icon">👥</span> Pelanggan</a></div>

      <div class="menu-item">
        <div class="menu-toggle" onclick="toggleMenu('layanan')">
          <span class="menu-link"><span class="icon">🎧</span> Layanan</span>
          <span class="arrow" id="arrow-layanan">▼</span>
        </div>
        <div class="submenu" id="submenu-layanan">
          <a href="data-layanan.html">Data Layanan</a>
          <a href="klaim-garansi.html">Klaim Garansi</a>
          <a href="data-garansi.html">Data Garansi</a>
        </div>
      </div>

      <div class="menu-item"><a href="pengaturan.html" class="menu-link"><span class="icon">⚙️</span> Pengaturan</a>
      </div>
      <div class="menu-item"><a href="#" id="logoutBtn" class="menu-link"><span class="icon">🚪</span> Keluar</a></div>
    </div>
  </aside>

  <div class="main">
    <div class="header">
      <div>☰</div>
      <div class="admin" id="adminBtn">👤 Admin ▾</div>
    </div>

    <div class="card">
      <h2>Ganti Password</h2>
      <form id="changePasswordForm">
        <div class="form-group">
          <label for="oldPassword">Password Saat ini :</label>
          <input type="password" id="oldPassword" placeholder="Masukkan Password Saat ini" required>
          <i class="fas fa-eye toggle-password" onclick="togglePassword('oldPassword', this)"></i>
        </div>
        <div class="form-group">
          <label for="newPassword">Password Baru :</label>
          <input type="password" id="newPassword" placeholder="Masukkan Password Baru" required>
          <i class="fas fa-eye toggle-password" onclick="togglePassword('newPassword', this)"></i>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password Baru :</label>
          <input type="password" id="confirmPassword" placeholder="Ulangi Password Baru" required>
          <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
        </div>
        <button type="submit" class="btn-submit">Ganti Password</button>
        <div id="message"></div>
      </form>
    </div>
  </div>

  <script>
    function togglePassword(id, icon) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    document.getElementById("changePasswordForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const oldPassword = document.getElementById("oldPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (newPassword !== confirmPassword) {
        message.textContent = "Password baru tidak cocok!";
        message.style.color = "red";
        return;
      }

      const token = sessionStorage.getItem("authToken");

      try {
        const res = await fetch("http://localhost:8080/gantipw", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            current_password: oldPassword,
            new_password: newPassword
          })
        });


        const data = await res.json();
        console.log("Status:", res.status);
        console.log("Response data:", data);

        if (!res.ok) {
          Swal.fire({
            icon: 'error',
            title: 'Gagal',
            text: data.message || "Gagal mengganti password"
          });
          return;
        }

        Swal.fire({
          icon: 'success',
          title: 'Berhasil',
          text: 'Password berhasil diganti!'
        });


      } catch (err) {
        message.textContent = "Terjadi kesalahan saat menghubungi server.";
        message.style.color = "red";
        console.error(err);
      }
    });

    function toggleMenu(menuId) {
      const submenu = document.getElementById('submenu-' + menuId);
      const arrow = document.getElementById('arrow-' + menuId);
      submenu.classList.toggle('show');
      arrow.classList.toggle('rotate');
    }

    const currentPath = window.location.pathname.split("/").pop();
    const allLinks = document.querySelectorAll('.menu a');
    allLinks.forEach(link => {
      if (link.getAttribute('href') === currentPath) {
        link.classList.add('active');
        const submenu = link.closest('.submenu');
        if (submenu) {
          submenu.classList.add('show');
          const menuId = submenu.id.split('-')[1];
          const arrow = document.getElementById('arrow-' + menuId);
          if (arrow) arrow.classList.add('rotate');
        }
      }
    });

    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", function (e) {
        e.preventDefault();
        sessionStorage.removeItem("authToken");
        sessionStorage.removeItem("userData");
        window.location.href = "../login.html";
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
