  <script>
    const token = sessionStorage.getItem('authToken');
    const tbody = document.getElementById("klaimBody");

    document.addEventListener("DOMContentLoaded", () => {
      fetchKlaimGaransi();
    });
    async function fetchKlaimGaransi() {
      try {
        const response = await fetch("http://localhost:8080/klaimgaransi", {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("Gagal mengambil data klaim");
        }

        const result = await response.json();
        const data = result.data; // Ambil array dari properti "data"
        tbody.innerHTML = ""; // Kosongkan isi sebelumnya

        data.forEach(item => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
        <td>${item.idklaim}</td>
        <td>${item.nama}</td>
        <td>${item.model}</td>
        <td>${new Date(item.klaim_tanggal).toLocaleDateString("id-ID")}</td>
        <td>${item.klaim_deskripsi}</td>
        <td>
          <select class="status-dropdown" onchange="ubahStatus('${item.idklaim}', this.value)">
            <option ${item.klaim_status === "Selesai" ? "selected" : ""}>Selesai</option>
            <option ${item.klaim_status === "Diproses" ? "selected" : ""}>Diproses</option>
            <option ${item.klaim_status === "Diterima" ? "selected" : ""}>Diterima</option>
            <option ${item.klaim_status === "Pending" ? "selected" : ""}>Pending</option>
            <option ${item.klaim_status === "Belum Diklaim" ? "selected" : ""}>Belum Diklaim</option>
          </select>
        </td>
      `;
          tbody.appendChild(tr);
        });

      } catch (error) {
        console.error("Error:", error);
        tbody.innerHTML = `<tr><td colspan="6">Gagal memuat data</td></tr>`;
      }
    }



    async function ubahStatus(idklaim, statusBaru) {
      const token = sessionStorage.getItem('authToken');

      try {
        const response = await fetch(`http://localhost:8080/klaimgaransi/update/${idklaim}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ klaim_status: statusBaru })
        });

        if (!response.ok) {
          throw new Error("Gagal mengubah status klaim");
        }

        await Swal.fire({
          icon: 'success',
          title: 'Berhasil!',
          text: `Status klaim ${idklaim} berhasil diubah menjadi "${statusBaru}"`,
          confirmButtonColor: '#3085d6'
        });

        // Refresh data jika perlu:
        if (typeof loadKlaimData === 'function') {
          loadKlaimData();
        }

      } catch (error) {
        console.error("Error:", error);
        await Swal.fire({
          icon: 'error',
          title: 'Gagal',
          text: 'Terjadi kesalahan saat mengubah status klaim. Silakan coba lagi.',
          confirmButtonColor: '#d33'
        });
      }
    }




    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", function (e) {
        e.preventDefault();
        sessionStorage.removeItem("authToken");
        sessionStorage.removeItem("userData");
        window.location.href = "../login.html";
      });
    }

    // Panggil saat halaman dimuat

  </script>
