<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <title>Laporan Penjualan | MobilBagus</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: #f8f8f8;
    }

    body {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 300px;
      background-color: #1e1c1a;
      color: white;
      padding: 1rem;
      box-sizing: border-box;
      transition: transform 0.3s ease;
    }

    .sidebar.hidden {
      transform: translateX(-100%);
      position: absolute;
      z-index: 1000;
    }

    .sidebar h1 {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
    }

    .menu-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .menu-toggle:hover {
      background-color: #2c2a28;
    }

    .menu-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
      width: 100%;
      padding: 0.5rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .menu-link:hover {
      background-color: #2c2a28;
    }

    .submenu {
      display: none;
      flex-direction: column;
      margin-left: 1.5rem;
      margin-top: 0.5rem;
    }

    .submenu a {
      padding: 0.3rem 0.5rem;
      border-radius: 5px;
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .submenu a:hover {
      background-color: #3d3a36;
    }

    .submenu.show {
      display: flex;
    }

    .submenu a.active {
      background-color: #675cff;
    }

    .icon {
      width: 20px;
    }

    .arrow {
      font-size: 0.7rem;
      transition: transform 0.3s;
    }

    .arrow.rotate {
      transform: rotate(180deg);
    }

    @media(max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        transform: none;
        position: relative;
      }
    }

    .container {
      display: flex;
    }

    iframe {
      width: 240px;
      height: 100vh;
      border: none;
    }

    .main {
      flex: 1;
      padding: 2rem;
    }

    .header {
      background-color: #675cff;
      color: white;
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .admin {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    th,
    td {
      padding: 0.9rem;
      text-align: left;
      font-size: 0.95rem;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f0f0f0;
    }

    .total-row {
      font-weight: bold;
      background: #fafafa;
    }

    .action-container {
      margin-top: 1rem;
      padding: 1.2rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-laporan {
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-laporan:hover {
      background-color: #43a047;
    }
  </style>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <h1>MobilBagus</h1>
    <div class="menu">
      <div class="menu-item">
        <a href="dashboard.html" class="menu-link"><span class="icon">🏠</span> Dashboard</a>
      </div>

      <div class="menu-item">
        <a href="manajemen-mobil.html" class="menu-link"><span class="icon">🚗</span> Manajemen Mobil</a>
      </div>

      <div class="menu-item">
        <div class="menu-toggle" onclick="toggleMenu('penjualan')">
          <span class="menu-link"><span class="icon">📈</span> Penjualan</span>
          <span class="arrow" id="arrow-penjualan">▼</span>
        </div>
        <div class="submenu" id="submenu-penjualan">
          <a href="data-penjualan.html">Data Penjualan</a>
          <a href="daftar-pembayaran.html">Daftar Penjualan</a>
          <a href="laporan.html">Laporan</a>
        </div>
      </div>

      <div class="menu-item">
        <a href="pelanggan.html" class="menu-link"><span class="icon">👥</span> Pelanggan</a>
      </div>

      <div class="menu-item">
        <div class="menu-toggle" onclick="toggleMenu('layanan')">
          <span class="menu-link"><span class="icon">🎧</span> Layanan</span>
          <span class="arrow" id="arrow-layanan">▼</span>
        </div>
        <div class="submenu" id="submenu-layanan">
          <a href="data-layanan.html">Data Layanan</a>
          <a href="klaim-garansi.html">Klaim Garansi</a>
          <a href="data-garansi.html">Data Garansi</a>
        </div>
      </div>

      <div class="menu-item">
        <a href="pengaturan.html" class="menu-link"><span class="icon">⚙️</span> Pengaturan</a>
      </div>

      <div class="menu-item">
        <a href="#" id="logoutBtn" class="menu-link"><span class="icon">🚪</span> Keluar</a>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="header">
      <div>☰</div>
      <div class="admin">👤 Admin ▾</div>
    </div>

    <table id="tabel-laporan">
      <thead>
        <tr>
          <th>No</th>
          <th>Merek</th>
          <th>Model</th>
          <th>Jumlah Terjual</th>
          <th>Total Pendapatan</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td colspan="3"><strong>Total</strong></td>
          <td id="total-jumlah"></td>
          <td id="total-pendapatan"></td>
        </tr>
      </tfoot>
    </table>


    <div class="action-container">
      <button id="btnLaporan" class="btn-laporan">Buat Laporan</button>
    </div>
  </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const token = sessionStorage.getItem('authToken');
      if (!token) {
        alert('Token JWT tidak ditemukan. Silakan login dulu.');
        return;
      }
      // Ambil data laporan penjualan
      fetch('http://localhost:8080/laporanpenjualan', {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/json'
        }
      })
        .then(response => {
          if (!response.ok) {
            throw new Error('Gagal mengambil data laporan. Cek token atau endpoint.');
          }
          return response.json();
        })
        .then(result => {
          const tbody = document.querySelector('#tabel-laporan tbody');
          const totalJumlahEl = document.getElementById('total-jumlah');
          const totalPendapatanEl = document.getElementById('total-pendapatan');

          tbody.innerHTML = '';

          result.data.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.merek}</td>
          <td>${item.model}</td>
          <td>${item.jumlah_terjual}</td>
          <td>Rp ${parseInt(item.total_pendapatan).toLocaleString('id-ID')}</td>
        `;
            tbody.appendChild(row);
          });

          totalJumlahEl.textContent = result.total_jumlah;
          totalPendapatanEl.textContent = 'Rp ' + parseInt(result.total_pendapatan).toLocaleString('id-ID');
        })
        .catch(error => {
          console.error('Error:', error.message);
          alert('Terjadi kesalahan saat mengambil data.');
        });

      // Event listener untuk tombol "Buat Laporan"
      const btnLaporan = document.getElementById('btnLaporan');
      btnLaporan.addEventListener('click', () => {
        fetch('http://localhost:8080/laporan/pdf', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        })
          .then(res => {
            if (!res.ok) {
              throw new Error('Gagal mengunduh PDF. Mungkin token tidak valid.');
            }
            return res.blob();
          })
          .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'laporan-penjualan.pdf';
            a.click();
            window.URL.revokeObjectURL(url);
          })
          .catch(err => alert(err.message));
      });
    });




























    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("hidden");
    }
    function toggleMenu(menuId) {
      const submenu = document.getElementById('submenu-' + menuId);
      const arrow = document.getElementById('arrow-' + menuId);
      submenu.classList.toggle('show');
      arrow.classList.toggle('rotate');
    }

    // Tandai link aktif
    const currentPath = window.location.pathname.split("/").pop();
    const allLinks = document.querySelectorAll('.menu a');

    allLinks.forEach(link => {
      if (link.getAttribute('href') === currentPath) {
        link.classList.add('active');

        const submenu = link.closest('.submenu');
        if (submenu) {
          submenu.classList.add('show');
          const menuId = submenu.id.split('-')[1];
          const arrow = document.getElementById('arrow-' + menuId);
          if (arrow) arrow.classList.add('rotate');
        }
      }
    });


    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", function (e) {
        e.preventDefault();
        sessionStorage.removeItem("authToken");
        sessionStorage.removeItem("userData");
        window.location.href = "../login.html";
      });
    }

  </script>
</body>

</html>
